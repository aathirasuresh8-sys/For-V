<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For V ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8f8;color:#382e31;font-family:Georgia,serif}
.wrap{max-width:760px;margin:auto;padding:28px 18px 55px}.hero{text-align:center;padding:25px 8px}
.heart{font-size:44px}.eyebrow{font:11px Arial;letter-spacing:4px;text-transform:uppercase;color:#9a8187}
h1{font-size:50px;margin:8px 0}.sub{font:15px Arial;color:#806f73;line-height:1.65}
.panel,.message,.section{background:white;border:1px solid #eadcdf;border-radius:24px;padding:21px;box-shadow:0 8px 28px #6b3d420d}
.panel{text-align:center;margin-bottom:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{font:inherit;color:inherit;background:white;border:1px solid #eadcdf;border-radius:19px;padding:16px;text-align:left;cursor:pointer}
button:hover{background:#fff1f4}button:active{transform:scale(.98)}
.mood b{font:15px Arial;display:block;margin-top:6px}.small{font:11px Arial;color:#907e82}
.message{margin-top:18px;text-align:center;line-height:1.75;font-size:16px;animation:pop .25s ease}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.center{text-align:center}.hidden{display:none}.back{margin-top:18px;text-align:center}.back button{font:13px Arial;text-decoration:underline;border:0;background:transparent}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(max-width:430px){h1{font-size:44px}.grid{gap:8px}button{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
<div id="home">
<section class="hero"><div class="heart">💌</div><div class="eyebrow">a little place for</div><h1>V</h1><div class="sub">Made by the girl who loves annoying you.<br>And loving you even more. ❤️</div></section>

<section class="panel"><b>How are you feeling today?</b><div class="sub" style="font-size:12px;margin-top:5px">Pick one. I might have something to say.</div></section>

<div class="grid" id="moods">
<button class="mood" data-m="happy">😊<b>I'm happy</b><span class="small">Tell me everything</span></button>
<button class="mood" data-m="sad">🥺<b>I'm sad</b><span class="small">Come here</span></button>
<button class="mood" data-m="annoyed">😤<b>I'm annoyed</b><span class="small">Uh-oh, grumpy boy</span></button>
<button class="mood" data-m="miss">😔<b>I miss you</b><span class="small">I miss you too</span></button>
<button class="mood" data-m="stress">🫠<b>I'm stressed</b><span class="small">Breathe</span></button>
<button class="mood" data-m="love">❤️<b>I need love</b><span class="small">Emergency hug</span></button>
<button class="mood" data-m="tired">😴<b>I'm tired</b><span class="small">Rest, my love</span></button>
<button class="mood" data-m="motivation">🤍<b>I need motivation</b><span class="small">I've got you</span></button>
<button class="mood" data-m="laugh">😂<b>Make me laugh</b><span class="small">Challenge accepted</span></button>
<button class="mood" data-m="thinking">🥰<b>I'm thinking of you</b><span class="small">Aww</span></button>
<button class="mood" data-m="angry">😡<b>I'm angry</b><span class="small">Let's handle this</span></button>
<button class="mood" data-m="hug">🫂<b>I need a hug</b><span class="small">One is waiting</span></button>
</div>
<div id="message" aria-live="polite"></div>

<div class="links">
<button id="story">📖<b>Our little story</b><span class="small">Just us</span></button>
<button id="secret">🤫<b>Something secret</b><span class="small">Don't click... maybe</span></button>
</div>
</div>

<div id="page" class="hidden"></div>
</div>

<script>
const messages={
happy:["Look at you being happy. 🥹❤️ I hope you know how much I love seeing you like this. Now tell me what happened—I want the entire story.","Your happiness looks really good on you, V. Please keep that smile for a little longer. ❤️"],
sad:["Come here, V. 🫂 You don't have to fix everything right now. Have a bad day if you need to. I'm still here.","You don't have to be strong every second. For today, just breathe. And remember that somewhere, someone is very, very much on your side. ❤️"],
annoyed:["Okay, Mr. Grumpy. 😤 Take a breath before you declare war on the entire world. And yes, I am still giving you a hug.","I know you're annoyed. I also know you're cute when you're annoyed, which is honestly very inconvenient for me. 😂❤️"],
miss:["I miss you too, V. More than this tiny screen can explain. If teleportation existed, I'd already be there annoying you. Until then—virtual hug. 🫂❤️","Missing me? Good. At least we're both suffering equally. Come back to me soon. ❤️"],
stress:["Pause. Shoulders down. Breathe. You don't have to solve your whole life tonight. One thing at a time, okay? I've got you. ❤️","Whatever is stressing you out right now is not bigger than you. Take it slowly. I believe in you."],
love:["LOVE EMERGENCY 🚨❤️ Treatment: one very long hug, one forehead kiss, and absolutely no escaping until I say so.","Your emotional-support girlfriend is currently reporting for duty. Come here. 🫂"],
tired:["Enough for today. Go rest, V. Drink some water, put the phone away and let yourself be tired. Tomorrow can wait. ❤️","You've done enough. Now go be a sleepy little human and rest. 😴❤️"],
motivation:["You don't need to have everything figured out. Just do the next thing. Then the next. I know what you're capable of, even when you forget. ❤️","Come on, V. One more step. Not to prove anything to anyone—just because I know how much you care about what you're building. I'm cheering for you."],
laugh:["Official girlfriend announcement: you have been prescribed one stupid joke, three terrible impressions and unlimited teasing. Side effects may include smiling. 😂","I was going to say something intelligent, but then I remembered you chose me. So here we are. 😂❤️"],
thinking:["You're thinking about me? Interesting. Because I may or may not have been thinking about you too. Okay fine. I definitely was. 🥰","Somewhere, you're thinking about me and I'm thinking about you. I really like that. ❤️"],
angry:["You're allowed to be angry. Just don't let the anger decide everything for you. Take your time. When you're ready, talk to me. I'm not going anywhere. ❤️","I'm not asking you to stop feeling angry. I'm just reminding you that you don't have to carry it alone."],
hug:["HUG REQUEST ACCEPTED. 🫂 Please remain still while your girlfriend delivers one unnecessarily long hug. No escape.","Close your eyes for a second. Imagine I'm right there, arms around you. That's your hug until I can give you the real one. ❤️"]
};
const home=document.getElementById("home"),out=document.getElementById("message"),page=document.getElementById("page");
function mood(k){let a=messages[k],t=a[Math.floor(Math.random()*a.length)];out.innerHTML=`<div class="message">💗<br>${t}<br><button id="again" style="border:0;text-decoration:underline;padding:7px;margin-top:8px;font:12px Arial">Tell me another one</button></div>`;document.getElementById("again").onclick=()=>mood(k)}
document.querySelectorAll(".mood").forEach(b=>b.onclick=()=>mood(b.dataset.m));
function openPage(title,body){home.classList.add("hidden");page.classList.remove("hidden");page.innerHTML=`<section class="hero"><div class="heart">💗</div><h2>${title}</h2></section><section class="section">${body}</section><div class="back"><button id="back">← Back to my moods</button></div>`;document.getElementById("back").onclick=()=>{page.classList.add("hidden");home.classList.remove("hidden")}}
document.getElementById("story").onclick=()=>openPage("Our little story",`<p>Two people. A thousand little moments. Some ridiculous, some difficult, some impossibly beautiful.</p><p>And somehow, through all of them, there is still an us.</p><p class="center"><b>More chapters coming soon. ❤️</b></p>`);
document.getElementById("secret").onclick=()=>openPage("You found it. 🤫",`<p class="center">Okay. Since you clicked...</p><p>V, behind all my teasing, nonsense and dramatic behaviour, there is a girl who genuinely feels very lucky to have you.</p><p>I don't need every day to be perfect. I just want more ordinary days with you.</p><p class="center"><b>That's all. ❤️</b></p>`);
</script>
</body>
</html>
